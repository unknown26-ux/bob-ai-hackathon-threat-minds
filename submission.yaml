submission:
  title: "ThreatLens"

  problem_statement: >
    SOC analysts receive thousands of raw security alerts daily from SIEM systems,
    firewalls, and threat-intelligence feeds in incompatible formats. Manual correlation
    takes hours, genuine threats are missed in the noise, and alert fatigue is endemic.
    ThreatLens automates the full triage pipeline so analysts see incidents, not noise.

  solution_summary: >
    ThreatLens ingests multi-source security alerts, normalises them to a common schema,
    and correlates related alerts into incidents using source IP, indicator, and
    time-window analysis. Each incident receives a transparent 0-100 risk score,
    MITRE ATT&CK mapping, false-positive classification, and a commander-level BLUF
    summary. IBM Bob integrates via MCP so analysts can query incidents in natural language.

  key_features:
    - "Multi-source alert ingestion and normalisation (SIEM, Firewall, ThreatIntel)"
    - "Deterministic correlation engine: 25 raw alerts grouped into 8 incidents using union-find"
    - "Explainable 0-100 risk scoring with severity, volume, threat-intel, and MITRE factors"
    - "MITRE ATT&CK automatic mapping (T1110, T1046, T1078, T1098, T1059, T1074 and more)"
    - "IBM Bob MCP integration with 5 tools: list incidents, investigate, MITRE map, BLUF"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "React", "Vite"]
    ibm_technologies: ["IBM Bob MCP"]
    databases: ["SQLite"]
    other: ["aiosqlite", "Pydantic", "MCP SDK", "uvicorn"]

  what_we_are_most_proud_of: >
    The correlation + explainable scoring pipeline. 25 raw alerts automatically collapse
    into 8 incidents with transparent, human-readable risk breakdowns. The critical
    incident (185.22.14.8 attacking 10.0.0.15) achieves risk 95/100 with 100% confidence
    by correlating threat-intel, port scan, brute-force, and privilege escalation
    into a single prioritised incident. IBM Bob can retrieve, investigate, and
    brief any incident via natural language through the MCP server.

  known_limitations: >
    Demo data is simulated — not connected to live SIEM/firewall feeds.
    Threat-intelligence list is a small hardcoded dataset matching the demo scenario.
    No authentication — prototype only. MCP server requires backend on localhost:8000.

